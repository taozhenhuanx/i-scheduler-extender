apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 默认调度器已接入 Extender 时使用此入口，避免 Operator 启动依赖自己的 HTTP 服务。
resources:
  - ../default

patches:
  - path: manager_bootstrap_patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: i-scheduler-extender-controller-manager
