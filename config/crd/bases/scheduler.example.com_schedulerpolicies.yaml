              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SchedulerPolicySpec describes the policy used for scheduler
              scoring and node protection.
            properties:
              checkIntervalSeconds:
                default: 5
                description: CheckIntervalSeconds is the interval between cluster-wide
                  balancing passes.
                format: int32
                minimum: 1
                type: integer
              cpuWeight:
                default: 10
                description: CPUWeight is the percentage of the scoring weight assigned
                  to CPU utilization.
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              highThreshold:
                default: 70
                description: HighThreshold is the weighted utilization percentage
                  at which a node can be cordoned.
                format: int32
                maximum: 100
                minimum: 5
                type: integer
              ignoreNodes:
                description: IgnoreNodes lists node names excluded from policy evaluation.
                items:
                  type: string
                type: array
              memoryWeight:
                default: 90
                description: MemoryWeight is the percentage of the scoring weight
                  assigned to memory utilization.
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              minSchedulableNodes:
                default: 4
                description: MinSchedulableNodes is the minimum number of eligible
                  nodes kept schedulable.
                format: int32
                minimum: 1
                type: integer
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector limits policy evaluation to nodes with all listed labels.
                  An empty selector matches every node.
                type: object
              recoveryThreshold:
                description: |-
                  RecoveryThreshold is the utilization percentage below which an automatically cordoned
                  node can be uncordoned. When omitted, it defaults to highThreshold minus 5.
                format: int32
                minimum: 0
                type: integer
              topNodesCount:
                default: 9
                description: TopNodesCount limits cordon decisions to the most heavily
                  utilized eligible nodes.
                format: int32
                minimum: 1
                type: integer
            type: object
          status:
