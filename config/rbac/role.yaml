---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/binding
  verbs:
  - create
- apiGroups:
  - metrics.k8s.io
  resources:
  - nodes
  verbs:
  - get
  - list
- apiGroups:
  - scheduler.example.com
  resources:
  - schedulerpolicies
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - scheduler.example.com
  resources:
  - schedulerpolicies/status
  verbs:
  - get
  - patch
  - update
