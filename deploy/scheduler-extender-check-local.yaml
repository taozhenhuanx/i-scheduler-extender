apiVersion: v1
kind: Pod
metadata:
  name: scheduler-extender-check
  namespace: default
spec:
  # 省略 schedulerName，验证当前默认调度器的 Extender 路径。
  restartPolicy: Never
  containers:
    - name: check
      # 当前单节点 m1 已缓存该镜像，避免镜像仓库网络影响验证。
      image: mirror.gcr.io/library/alpine:3
      imagePullPolicy: Never
      command: ["sleep", "600"]
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
