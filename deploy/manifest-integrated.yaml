apiVersion: v1
kind: ServiceAccount
metadata:
  name: i-scheduler-extender
  namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: i-scheduler-extender-config
  namespace: kube-system
data:
  config.yaml: |
    metricsBindAddress: "0"
    healthProbeBindAddress: ":8082"
    extenderBindAddress: ":8080"
    leaderElection: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: i-scheduler-extender
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/binding"]
    verbs: ["create"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["scheduler.example.com"]
    resources: ["schedulerpolicies"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["scheduler.example.com"]
    resources: ["schedulerpolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: i-scheduler-extender
subjects:
  - kind: ServiceAccount
    name: i-scheduler-extender
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: i-scheduler-extender
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: i-scheduler-extender
  namespace: kube-system
spec:
  selector:
    component: i-scheduler-extender
    tier: control-plane
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i-scheduler-extender
  namespace: kube-system
  labels:
    component: i-scheduler-extender
    tier: control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: i-scheduler-extender
      tier: control-plane
  template:
    metadata:
      labels:
        component: i-scheduler-extender
        tier: control-plane
    spec:
      serviceAccountName: i-scheduler-extender
      containers:
        - name: i-scheduler-extender
          image: lixd96/i-scheduler-extender:v1
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/i-scheduler-extender/config.yaml
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8082
          volumeMounts:
            - name: operator-config
              mountPath: /etc/i-scheduler-extender/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
      volumes:
        - name: operator-config
          configMap:
            name: i-scheduler-extender-config
