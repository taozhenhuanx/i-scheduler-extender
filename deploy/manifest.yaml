apiVersion: v1
kind: ServiceAccount
metadata:
  name: i-scheduler-extender
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: i-scheduler-extender
subjects:
  - kind: ServiceAccount
    name: i-scheduler-extender
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: i-scheduler-extender
  namespace: kube-system
data:
  config.yaml: |
    metricsBindAddress: "0"
    healthProbeBindAddress: ":8082"
    extenderBindAddress: ":8080"
    leaderElection: true
  i-scheduler-extender.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1beta2
    kind: KubeSchedulerConfiguration
    profiles:
      - schedulerName: i-scheduler-extender
    leaderElection:
      leaderElect: false
    extenders:
    - urlPrefix: "http://localhost:8080"
      enableHTTPS: false
      filterVerb: "filter"
      prioritizeVerb: "prioritize"
      bindVerb: bind
      nodeCacheCapable: false
      weight: 1
      # managedResources:
      # - name: nvidia.com/gpu
      #   ignoredByScheduler: true
      # - name: nvidia.com/gpumem
      #   ignoredByScheduler: true
      # - name: nvidia.com/gpucores
      #   ignoredByScheduler: true
      # - name: nvidia.com/gpumem-percentage
      #   ignoredByScheduler: true
      # - name: nvidia.com/priority
      #   ignoredByScheduler: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    component: i-scheduler-extender
    tier: control-plane
  name: i-scheduler-extender
  namespace: kube-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: i-scheduler-extender
      tier: control-plane
  template:
    metadata:
      labels:
        component: i-scheduler-extender
        tier: control-plane
    spec:
      serviceAccountName: i-scheduler-extender
      containers:
        - name: kube-scheduler
          image: registry.aliyuncs.com/google_containers/kube-scheduler:v1.22.9
          imagePullPolicy: IfNotPresent
          command:
            - kube-scheduler
            - --config=/etc/kubernetes/i-scheduler-extender.yaml
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
          resources:
            requests:
              cpu: '0.1'
          volumeMounts:
            - name: config-volume
              mountPath: /etc/kubernetes
        - name: i-scheduler-extender
          image: lixd96/i-scheduler-extender:v1
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/i-scheduler-extender/config.yaml
          ports:
            - containerPort: 8080
            - name: health
              containerPort: 8082
          volumeMounts:
            - name: config-volume
              mountPath: /etc/i-scheduler-extender/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
      volumes:
        - name: config-volume
          configMap:
            name: i-scheduler-extender
